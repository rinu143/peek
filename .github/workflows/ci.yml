name: CI

on:
  push:
    branches: [ main, master, addfeat ]
  pull_request:
    branches: [ main, master, addfeat ]

jobs:
  build-and-test:
    name: Build and Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache ONNX Models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: |
            build/models
            engine/models/*.onnx
          key: onnx-models-${{ hashFiles('engine/models/download_models.py') }}
          restore-keys: |
            onnx-models-

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pywin32

      - name: Fetch and Verify Face & Segmentation Models
        run: |
          python engine/models/download_models.py

      - name: Run Python Pytest Suite
        run: |
          python -m pytest tests/ -v

      - name: Run .NET Unit Tests (PeekSetup & PeekUpdate)
        run: |
          dotnet test app/PeekSetup.Tests/PeekSetup.Tests.csproj -c Release -p:UseSharedCompilation=false --verbosity normal

      - name: Configure Credential Provider (CMake static CRT)
        run: |
          cmake -B credential_provider/build -S credential_provider -A x64

      - name: Build Credential Provider & Tests (MSBuild Release x64)
        run: |
          cmake --build credential_provider/build --config Release

      - name: Run Credential Provider C++ Tests
        run: |
          credential_provider/build/Release/test_autoselect.exe
